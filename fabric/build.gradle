plugins {
	id 'multiloader-loader'
	id 'net.fabricmc.fabric-loom-remap'
}

loom {
	mods {
		"cobblepartyhud" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Solo para compilar: en el juego los pone el pack (fabric.mod.json los pide en depends/recommends)
	modCompileOnly "com.cobblemon:fabric:${cobblemon_version}"
	modCompileOnly "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
	modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}
